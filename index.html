<!doctype html>
<html lang="pt-BR">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'self'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard Takaara</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#eef1f7; --surface:#ffffff; --surface2:#f6f8fc; --line:#e1e6f0; --grid:#e8ecf4;
  --ink:#0f1b3d; --ink2:#4b5675; --ink3:#7b86a3;
  --side:#0d1b5e; --side2:#16286f; --side-ink:#e8ecff; --side-ink2:#9fb0e6; --side-act:#2447b8;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6;
  --good:#1e8449; --bad:#c0392b; --warn:#e67e22;
  --bar-dim:#c9d6ee; --shadow:0 1px 2px rgba(15,27,61,.06),0 4px 14px rgba(15,27,61,.05);
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --bg:#0b1126; --surface:#131b36; --surface2:#182243; --line:#243056; --grid:#222d52;
    --ink:#eef1fb; --ink2:#b7c0dc; --ink3:#8793b5;
    --side:#070d22; --side2:#0f1838; --side-act:#2447b8;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#2a9d2a; --s7:#9085e9;
    --good:#4ec27a; --bad:#ef6a5b; --warn:#f0a04b; --bar-dim:#2a3a6b; --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0b1126; --surface:#131b36; --surface2:#182243; --line:#243056; --grid:#222d52;
  --ink:#eef1fb; --ink2:#b7c0dc; --ink3:#8793b5;
  --side:#070d22; --side2:#0f1838; --side-act:#2447b8;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#2a9d2a; --s7:#9085e9;
  --good:#4ec27a; --bad:#ef6a5b; --warn:#f0a04b; --bar-dim:#2a3a6b; --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;display:flex}
button,select,input{font:inherit;color:inherit}
.side{align-self:flex-start;width:236px;flex:none;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:14px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{background:#fff;border-radius:14px;padding:6px;display:flex;justify-content:center}
.logo img{max-width:100%;max-height:112px;width:auto;height:auto;display:block}
.brand{font-weight:700;font-size:17px;margin:16px 6px 10px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:12px;background:none;border:0;border-radius:10px;color:var(--side-ink2);padding:10px 12px;text-align:left;cursor:pointer;font-size:14.5px}
.nav button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav button:hover{background:var(--side2);color:#fff}
.nav button.on{background:var(--side-act);color:#fff;font-weight:600}
.sidefoot{margin-top:auto;border-top:1px solid #ffffff22;padding-top:12px;font-size:12.5px;color:var(--side-ink2);display:flex;flex-direction:column;gap:8px}
.sidefoot .btn{background:var(--side2);border:1px solid #ffffff1c;border-radius:9px;padding:9px 11px;text-align:left;cursor:pointer;color:var(--side-ink)}
.sidefoot .btn:hover{background:#22358a}
.sidefoot label{display:flex;gap:9px;align-items:flex-start;cursor:pointer;line-height:1.3}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:14px 22px 10px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;border-bottom:1px solid var(--line)}
.top h1{font-size:21px;margin:0 8px 0 0;font-weight:700;letter-spacing:-.01em}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;box-shadow:var(--shadow)}
.seg button{border:0;background:none;padding:6px 11px;border-radius:8px;cursor:pointer;color:var(--ink2);font-size:13px;white-space:nowrap}
.seg button:hover{background:var(--surface2)}
.seg button.on{background:var(--s1);color:#fff;font-weight:600}
.arrow{width:30px;height:30px;border:1px solid var(--line);background:var(--surface);border-radius:9px;cursor:pointer;font-size:17px;line-height:1;box-shadow:var(--shadow)}
.arrow:disabled{opacity:.35;cursor:default}
.field{display:flex;align-items:center;gap:6px;color:var(--ink2);font-size:13px}
.cf{position:relative}
.cfbtn{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 9px;color:var(--ink);font:inherit;font-size:13px;cursor:pointer;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cfpanel{position:absolute;top:calc(100% + 6px);left:0;z-index:60;width:320px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(15,23,42,.18);padding:10px;display:flex;flex-direction:column;gap:8px}
.cfpanel input[type=search]{width:100%;box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 9px;color:var(--ink);font-size:13px}
.cfbar{display:flex;gap:8px}
.cfbar button{flex:1;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:5px 6px;color:var(--ink2);font-size:12px;cursor:pointer}
.cflist{max-height:300px;overflow:auto;display:flex;flex-direction:column}
.cfitem{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:7px;font-size:13px;color:var(--ink);cursor:pointer}
.cfitem:hover{background:var(--surface2)}
.cfitem span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field .cfitem input{padding:0;border:0;background:none;width:15px;height:15px;margin:0;flex:none}
.cfpanel{color:var(--ink)}
.cfempty{padding:10px;color:var(--ink2);font-size:13px}
.field input,.field select{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 9px;color:var(--ink)}
.range{color:var(--ink3);font-size:12.5px;margin-left:auto}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:0 22px;margin-top:10px}
.chip{display:inline-flex;gap:8px;align-items:center;background:var(--s1);color:#fff;border-radius:999px;padding:4px 6px 4px 12px;font-size:12.5px;cursor:default}
.chip b{font-weight:600}
.chip button{border:0;background:#ffffff33;color:#fff;border-radius:50%;width:20px;height:20px;cursor:pointer;line-height:1}
.chip.clear{background:var(--surface);color:var(--ink2);border:1px solid var(--line);cursor:pointer;padding:4px 12px}
.page{padding:16px 22px 40px;display:flex;flex-direction:column;gap:16px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(var(--c,4),minmax(0,1fr))}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.g2{grid-template-columns:repeat(auto-fit,minmax(470px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;min-width:0}
.card h3{margin:0 0 2px;font-size:14px;font-weight:650;color:var(--ink)}
.card .sub{color:var(--ink3);font-size:12px;margin-bottom:8px}
.kpi .lb{color:var(--ink2);font-size:12.5px;font-weight:600}
.kpi .v{font-size:25px;font-weight:700;letter-spacing:-.02em;margin:4px 0 2px;white-space:nowrap}
.kpi .cmp{font-size:12px;color:var(--ink3)}
.kpi .cmp .up{color:var(--good);font-weight:600}.kpi .cmp .dn{color:var(--bad);font-weight:600}.kpi .cmp .eq{font-weight:600}
.kpi .of{font-size:11.5px;color:var(--s1);font-weight:600}
.kpi.sel{border-color:var(--s1);box-shadow:0 0 0 1px var(--s1)}
.alert{display:flex;gap:10px;align-items:flex-start;background:#fff4e5;border:1px solid #f3cf9a;color:#7a4a05;border-radius:12px;padding:10px 14px;font-size:13px}
:root[data-theme="dark"] .alert{background:#3a2a10;border-color:#6b4a14;color:#f5d9a6}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])) .alert{background:#3a2a10;border-color:#6b4a14;color:#f5d9a6}}
.alert.info{background:#e8f1fd;border-color:#b7d1f5;color:#17407a}
:root[data-theme="dark"] .alert.info{background:#14264a;border-color:#27427a;color:#b9d0f5}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])) .alert.info{background:#14264a;border-color:#27427a;color:#b9d0f5}}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{position:sticky;top:0;background:var(--surface);text-align:left;color:var(--ink2);font-weight:600;padding:7px 6px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none}
th.r,td.r{text-align:right}
td{padding:6px 6px;border-bottom:1px solid var(--grid);white-space:nowrap;max-width:230px;overflow:hidden;text-overflow:ellipsis}
td:first-child,th:first-child{max-width:175px}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--surface2)}
tbody tr.on{background:color-mix(in srgb,var(--s1) 16%,transparent);font-weight:600}
tbody tr.dim{opacity:.45}
tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0;position:sticky;bottom:0;background:var(--surface)}
.twrap{overflow:auto;max-height:430px}
.tfoot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12.5px;color:var(--ink3)}
.tfoot button{background:none;border:0;color:var(--s1);cursor:pointer;font-weight:600}
.hb{display:flex;flex-direction:column;gap:5px}
.hb .row{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:10px;align-items:center;cursor:pointer;padding:2px 0;border-radius:6px}
.hb .row:hover{background:var(--surface2)}
.hb .nm{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.hb .trk{height:14px;background:transparent;position:relative}
.hb .bar{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:var(--s1)}
.hb .bar.dim{background:var(--bar-dim)}
.hb .bar.ov{background:var(--s1);z-index:1}
.hb .vl{font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink2);min-width:84px;text-align:right;white-space:nowrap}
.mlink{color:var(--s1);cursor:pointer;font-weight:600;text-decoration:none}.mlink:hover{text-decoration:underline}
.mback{position:fixed;inset:0;background:rgba(10,16,40,.55);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.mbox{background:var(--surface);color:var(--ink);border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.35);width:min(980px,100%);max-height:88vh;display:flex;flex-direction:column;padding:18px 20px}
.mbox .twrap{max-height:none;flex:1;overflow:auto}
.mtabs{display:flex;gap:6px;margin-bottom:10px}.mtab{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:5px 14px;cursor:pointer;color:var(--ink2);font-weight:600}.mtab.on{background:var(--s1);border-color:var(--s1);color:#fff}
.mq{display:flex;gap:8px;margin:2px 0 10px}.mq input{flex:1;max-width:340px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--ink);font:inherit}.mpb{padding:7px 16px;border:1px solid var(--s1);border-radius:8px;background:var(--s1);color:#fff;font-weight:600;cursor:pointer}
@media print{.mq{display:none}}
.mhd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.mx{background:none;border:0;font-size:26px;line-height:1;cursor:pointer;color:var(--ink3)}
.pf{display:inline-block;min-width:64px;padding:3px 10px;border-radius:4px;font-weight:700;text-align:center;color:#fff}.pf.g{background:#2e7d32}.pf.y{background:#f5c842;color:#3d2f00}.pf.r{background:#d9434f}
.hb .vl .pc{display:inline-block;min-width:54px;margin-left:8px;color:var(--ink);font-weight:600}
.hb .row.dim .nm{opacity:.55}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:2px 0 6px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
svg text{fill:var(--ink3);font-size:11px}
svg .gl{stroke:var(--grid);stroke-width:1}
.tip{position:fixed;z-index:99;pointer-events:none;background:var(--ink);color:var(--bg);padding:7px 10px;border-radius:9px;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.25);display:none;max-width:280px}
.tip b{display:block;margin-bottom:2px}
.csv{background:none;border:1px solid var(--line);border-radius:8px;color:var(--ink2);padding:3px 9px;font-size:12px;cursor:pointer}
.csv:hover{background:var(--surface2)}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.empty{color:var(--ink3);padding:24px;text-align:center}
@media (max-width:900px){.side{display:none}.top{padding:10px 12px}.page{padding:12px}.chips{padding:0 12px}}
/* ===== Takaara Design System (tokens.json) ===== */
:root{
  --bg:#DEE9F4; --surface:#F4F7FB; --surface2:#E7EEF7; --line:#DEE7F1; --grid:#DEE7F1;
  --ink:#191C18; --ink2:#42473F; --ink3:#7C827A;
  --side:#F4F7FB; --side2:#E9F0F8; --side-ink:#191C18; --side-ink2:#5C625B; --side-act:#0E8F45;
  --s1:#0E8F45; --s2:#E8A100; --s3:#1E66C8; --s4:#4B33A8; --s5:#B4211A; --s6:#86CD9F; --s7:#8C9FB5;
  --good:#0A7238; --bad:#C4211C; --warn:#A06E00; --bar-dim:#CFDAE8;
  --shadow:0 1px 2px rgba(23,37,60,.04); --ring:0 0 0 2px #fff,0 0 0 4px rgba(22,155,79,.55);
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    --bg:#101826; --surface:#16202F; --surface2:#1C2839; --line:#202C3E; --grid:#243145;
    --ink:#EEF3F9; --ink2:#C4D0DE; --ink3:#93A2B4;
    --side:#16202F; --side2:#1F2B3D; --side-ink:#EEF3F9; --side-ink2:#93A2B4; --side-act:#169B4F;
    --s1:#22B25F; --s2:#F2C25A; --s3:#5A9BEA; --s4:#8C7BE0; --s5:#E4665E; --s6:#5FA97F; --s7:#7C8EA5;
    --good:#7FD9A2; --bad:#F4A19C; --warn:#F2C25A; --bar-dim:#33425A; --shadow:0 1px 2px rgba(3,7,14,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#101826; --surface:#16202F; --surface2:#1C2839; --line:#202C3E; --grid:#243145;
  --ink:#EEF3F9; --ink2:#C4D0DE; --ink3:#93A2B4;
  --side:#16202F; --side2:#1F2B3D; --side-ink:#EEF3F9; --side-ink2:#93A2B4; --side-act:#169B4F;
  --s1:#22B25F; --s2:#F2C25A; --s3:#5A9BEA; --s4:#8C7BE0; --s5:#E4665E; --s6:#5FA97F; --s7:#7C8EA5;
  --good:#7FD9A2; --bad:#F4A19C; --warn:#F2C25A; --bar-dim:#33425A; --shadow:0 1px 2px rgba(3,7,14,.35);
}
body{font-family:"Urbanist",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px}
button,select,input{font-family:inherit}
.side{border-right:1px solid var(--line)}
.nav button:hover{background:var(--side2);color:var(--side-ink)}
.nav button.on{color:#fff}
.sidefoot{border-top-color:var(--line)}
.sidefoot .btn{border-color:var(--line);border-radius:10px}
.sidefoot .btn:hover{background:var(--side2)}
.top h1{font-size:26px;font-weight:500}
.seg{border-radius:999px}.seg button{border-radius:999px}
.seg button.on{box-shadow:0 6px 18px -6px rgba(14,143,69,.45)}
.arrow,.field input,.field select,.cfbtn,.cfpanel input[type=search]{border-radius:10px}
.card{border-radius:16px;padding:16px 20px}
.card h3{font-size:16px;font-weight:600}
.kpi .lb{font-weight:500}
.kpi .v{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}
.card .sub,.kpi .cmp{font-size:12px}
.alert{border-radius:12px}
.mbox{border-radius:20px}
.mpb,.mtab.on{background:var(--s1);border-color:var(--s1)}
.mlink{color:var(--s1)}
:root[data-theme="light"] .mlink,.mlink{color:var(--good)}
table{font-variant-numeric:tabular-nums}
.nav button.on:hover{background:var(--side-act);color:#fff}

#lock{position:fixed;inset:0;z-index:5000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.lockbox{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:28px 30px;width:min(380px,100%);display:flex;flex-direction:column;gap:10px;text-align:center;align-items:center}
.lockbox h2{margin:0;font-size:22px;font-weight:600}.lockbox p{margin:0 0 6px;color:var(--ink3)}
.lockbox input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--ink);font:inherit}
.lockbox button{width:100%;padding:10px;border:0;border-radius:10px;background:var(--s1);color:#fff;font-weight:600;cursor:pointer}
.lockbox button:disabled{opacity:.6}#lockErr{color:var(--bad);min-height:18px;font-size:13px}
</style>
</head>

<script>
"use strict";
/* ================= utilidades ================= */
const $=s=>document.querySelector(s);
const nfR=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const nf2=new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const nf0=new Intl.NumberFormat('pt-BR',{maximumFractionDigits:0});
const fR=v=>v==null||isNaN(v)?'—':nfR.format(v);
const f2=v=>v==null||isNaN(v)?'—':nf2.format(v);
const f0=v=>v==null||isNaN(v)?'—':nf0.format(v);
const fP=v=>v==null||!isFinite(v)?'—':nf2.format(v*100)+'%';
const fD=v=>v==null||!isFinite(v)?'—':nf2.format(v*100);          // percentual como decimal (frete)
const fK=v=>{const a=Math.abs(v);if(a>=1e6)return 'R$ '+nf2.format(v/1e6).replace(/,00$/,'')+' mi';if(a>=1e3)return 'R$ '+nf0.format(v/1e3)+' mil';return 'R$ '+nf0.format(v)};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const div=(a,b)=>b?a/b:null;

/* ================= datas ================= */
let U0=Date.UTC(2025,9,1),BY=2025,BM=9;
const dayDate=d=>new Date(U0+d*864e5);                       // UTC
const dayStr=d=>{const x=dayDate(d);return String(x.getUTCDate()).padStart(2,'0')+'/'+String(x.getUTCMonth()+1).padStart(2,'0')+'/'+x.getUTCFullYear()};
const dayIso=d=>dayDate(d).toISOString().slice(0,10);
const isoDay=s=>Math.round((Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10))-U0)/864e5);
const ymd=d=>{const x=dayDate(d);return[x.getUTCFullYear(),x.getUTCMonth(),x.getUTCDate()]};
const mkDay=(y,m,d)=>Math.round((Date.UTC(y,m,d)-U0)/864e5);       // aceita m fora de 0-11
const monthStart=(y,m)=>mkDay(y,m,1);
const monthEnd=(y,m)=>mkDay(y,m+1,0);
let MI=[],NM=0,MLABEL=[],MSTART=[];                              // índice de mês por dia

/* ================= estado ================= */
const S={page:'geral',p:'mes',k:0,d0:0,d1:0,emp:0,merge:true,cliSet:new Set(),cliOpen:false,cliQ:'',sel:{vend:null,prod:null,cli:null,mot:null,forn:null,mtr:null},all:{},sort:{}};
try{const t=localStorage.getItem('painel-tema');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}
try{const m=localStorage.getItem('painel-merge');if(m!==null)S.merge=m==='1'}catch(e){}

/* ================= preparo dos dados ================= */
let D,REFD,GV=[],PK=[],PNAME={},PGRP={},VNAME={},CNAME={},FORN={},hasSel=false;
const PALIAS={453:44};   // cód. 453 (inativado) soma no 44 — TOMATE DEBORA AA
function prepare(){
  D=window.DADOS;
  BY=+D.base.slice(0,4);BM=+D.base.slice(5,7)-1;U0=Date.UTC(BY,BM,+D.base.slice(8,10)||1);
  const V=D.venda;
  REFD=0;for(let i=0;i<V.d.length;i++)if(V.d[i]>REFD)REFD=V.d[i];
  MI=[];MLABEL=[];MSTART=[];NM=0;
  for(let d=0;d<=REFD+40;d++){const[y,m]=ymd(d);const mi=(y-BY)*12+m-BM;MI[d]=mi;if(mi>=NM){NM=mi+1;MLABEL[mi]=MES[m]+'/'+String(y).slice(2);MSTART[mi]=d}}
  NM=MI[REFD]+1;
  for(const c in D.vend){const[n,g]=D.vend[c];VNAME[c]=n;GV[c]=S.merge?g:+c}
  PGRP={};PNAME={};const names={};
  for(const c in D.prod){const k=PALIAS[c]??+c;PK[c]=k}
  const cnt={};
  for(const c in D.prod){const k=PK[c];if(k!==+c)continue;const n=D.prod[c][0];(cnt[n]=cnt[n]||[]).push(k)}
  for(const c in D.prod){const k=PK[c];if(k!==+c)continue;const n=D.prod[c][0];PNAME[k]=cnt[n].length>1?n+' (cód. '+k+')':n;PGRP[k]=D.prod[c][1]}
  CNAME=D.cli;
  if(S.sel.vend!=null&&!VNAME[S.sel.vend])S.sel.vend=null;
}
const gname=g=>VNAME[g]||('Vendedor '+g);

/* ================= período ================= */
function range(){
  const[y,m,dd]=ymd(REFD);let a,b;const k=S.k;
  switch(S.p){
    case'hoje':a=b=REFD-k;break;
    case'7d':b=REFD-7*k;a=b-6;break;
    case'30d':b=REFD-30*k;a=b-29;break;
    case'mes':{const mm=m-k;a=monthStart(y,mm);b=k===0?REFD:monthEnd(y,mm);break}
    case'mesant':{const mm=m-1-k;a=monthStart(y,mm);b=monthEnd(y,mm);break}
    case'ano':{const yy=y-k;a=mkDay(yy,0,1);b=k===0?REFD:mkDay(yy,11,31);break}
    default:a=S.d0;b=S.d1;
  }
  return[Math.max(a,-9999),b];
}
function prevRange(a,b){
  const[ya,ma,da]=ymd(a);const[yb,mb,db]=ymd(b);
  if(da===1&&ya===yb&&ma===mb){                         // dentro de um mês, começando no dia 1
    const pa=monthStart(ya,ma-1);const len=b-a;const pb=Math.min(pa+len,monthEnd(ya,ma-1));return[pa,pb];
  }
  if(da===1&&ma===0&&db>=1&&ya===yb&&(mb>0)){          // ano até agora
    const pa=mkDay(ya-1,0,1);return[pa,pa+(b-a)];
  }
  const len=b-a+1;return[a-len,b-1];
}
const MINDAY=0;
function periodLabel(a,b){return a===b?dayStr(a):dayStr(a)+' a '+dayStr(b)}

/* ================= filtros / seleção ================= */
function hasAnySel(){const s=S.sel;return s.vend!=null||s.prod!=null||s.cli!=null||s.mot!=null||s.forn!=null||s.mtr!=null}
const empOk=e=>S.emp===0||e===S.emp;
const empOkRaw=e=>S.emp===0||(e-500)===S.emp;
function toggleSel(type,key){S.sel[type]=(S.sel[type]===key)?null:key;render()}

/* ================= agregações ================= */
let STAMP=0;const pedSt=new Uint32Array(1e6),cliSt=new Uint32Array(5000),notaSt=new Uint32Array(1e6),fornSt=new Uint32Array(5000);
const mapAdd=(m,k,f)=>{let o=m.get(k);if(!o){o=f();m.set(k,o)}return o};

/* VENDAS */
// filtro de clientes (só na tela Devoluções): vale para devolução e para a venda usada no % sobre a venda
function cliFilter(){return S.page==='dev'&&S.cliSet.size?S.cliSet:null}
function aggV(a,b,selOn,full){
  const V=D.venda,n=V.d.length,s=S.sel,st=++STAMP;
  const R={fat:0,custo:0,desc:0,qtd:0,ped:0,ncli:0,semCusto:0,byDay:full?new Float64Array(Math.max(0,b-a+1)):null,
    mFat:new Float64Array(NM),mCusto:new Float64Array(NM),mDesc:new Float64Array(NM),
    vend:new Map(),prod:new Map(),cli:new Map(),vgrp:new Map(),pgrp:new Map()};
  const sv=selOn?s.vend:null,sp=selOn?s.prod:null,sc=selOn?s.cli:null,cf=cliFilter();
  for(let i=0;i<n;i++){
    const e=V.e[i];if(S.emp&&e!==S.emp)continue;
    const vg=GV[V.v[i]],pk=PK[V.p[i]],c=V.c[i];
    if(cf&&!cf.has(c))continue;
    if(sv!=null&&vg!==sv)continue;if(sp!=null&&pk!==sp)continue;if(sc!=null&&c!==sc)continue;
    const d=V.d[i],mi=MI[d],fat=V.fat[i],cu=V.custo[i];
    R.mFat[mi]+=fat;R.mCusto[mi]+=cu;R.mDesc[mi]+=V.desc[i];

function aggD(a,b,selOn,full){

      t=mapAdd(R.prod,pk,()=>({valor:0,qtd:0,notas:new Set()}));t.valor+=val;t.qtd+=X.qtd[i];t.notas.add(nt);
      t=mapAdd(R.cli,c,()=>({valor:0,qtd:0,notas:new Set()}));t.valor+=val;t.qtd+=X.qtd[i];t.notas.add(nt);
      const vgg=D.vend[X.v[i]][1];R.vgrp.set(vgg,(R.vgrp.get(vgg)||0)+val);
      const pg=PGRP[pk];R.pgrp.set(pg,(R.pgrp.get(pg)||0)+val);

/* COMISSÃO */
function aggCom(a,b,selOn){
  const K=D.com,n=K.d.length,per=D.comPct;
  const R={tot:0,desc:0,dev:0,base:0,comis:0,mComis:new Float64Array(NM),vend:new Map()};
  const vnameByCod={};for(const c in D.vend)vnameByCod[c]=D.vend[c][0];
  const dm=new Map(),dmM=new Map();                       // devolução por vendedor (nome) e por vendedor×mês
  const X=D.dev;
  for(let i=0;i<X.d.length;i++){
    const e=X.e[i];if(S.emp&&e!==S.emp)continue;
    const nm=vnameByCod[X.v[i]];if(nm.includes('VENDAS NA PEDRA'))continue;
    const d=X.d[i];if(selOn&&S.sel.vend!=null&&GV[X.v[i]]!==S.sel.vend)continue;
    const mk=nm+'|'+MI[d];dmM.set(mk,(dmM.get(mk)||0)+X.valor[i]);
    if(d>=a&&d<=b)dm.set(nm,(dm.get(nm)||0)+X.valor[i]);
  }
  const mBase=new Map();
  for(let i=0;i<n;i++){
    if(S.emp&&K.e[i]-500!==S.emp)continue;const nm=K.vend[i],d=K.d[i];
    if(selOn&&S.sel.vend!=null){const cod=Object.keys(D.vend).find(c=>D.vend[c][0]===nm);if(cod==null||GV[cod]!==S.sel.vend)continue}
    const v=K.tot[i]-K.desc[i];const mk=nm+'|'+MI[d];mBase.set(mk,(mBase.get(mk)||0)+v);
    if(d>=a&&d<=b){const t=mapAdd(R.vend,nm,()=>({tot:0,desc:0,dev:0}));t.tot+=K.tot[i];t.desc+=K.desc[i]}
  }
  for(const[nm,t]of R.vend){t.dev=dm.get(nm)||0;t.base=t.tot-t.desc-t.dev;t.pct=per[nm]||0;t.comis=t.base*t.pct;R.tot+=t.tot;R.desc+=t.desc;R.dev+=t.dev;R.base+=t.base;R.comis+=t.comis}
  for(const[mk,v]of mBase){const[nm,mi]=mk.split('|');const dv=dmM.get(mk)||0;R.mComis[+mi]+=(v-dv)*(per[nm]||0)}
  return R;
}
/* FRETE */
function aggF(a,b,selOn,full){
  const F=D.fent,s=S.sel,R={custo:0,frete:0,desc:0,terc:0,frota:0,cargas:new Set(),ent:0,cli:new Set(),peso:0,valor:0,
    mCusto:new Float64Array(NM),byDay:new Float64Array(Math.max(0,b-a+1)),mot:new Map(),rota:new Map(),cl:new Map(),porCarga:new Map()};
  for(const x of F){
    if(x[1]==null||!empOkRaw(x[2]))continue;
    if(selOn&&s.cli!=null&&x[4]!==s.cli)continue;
    if(selOn&&s.mtr!=null&&x[11]!==s.mtr)continue;
    const d=x[1];R.mCusto[MI[d]]+=x[17];
    if(d<a||d>b)continue;
    R.custo+=x[17];R.frete+=x[15];R.desc+=x[16];R.peso+=x[13];R.valor+=x[14];R.ent++;R.cargas.add(x[0]);R.cli.add(x[4]);R.byDay[d-a]+=x[17];
    if(x[12]==='TERCEIRO')R.terc+=x[17];else if(x[12]==='FROTA UNIAO')R.frota+=x[17];
    if(full){
      let t=mapAdd(R.mot,x[11],()=>({custo:0,peso:0,valor:0,cargas:new Set()}));t.custo+=x[17];t.peso+=x[13];t.valor+=x[14];t.cargas.add(x[0]);
      t=mapAdd(R.rota,x[8]||'—',()=>({custo:0,peso:0,valor:0,ent:0}));t.custo+=x[17];t.peso+=x[13];t.valor+=x[14];t.ent++;
      t=mapAdd(R.cl,x[4],()=>({nome:x[5],custo:0,peso:0,valor:0,ent:0}));t.custo+=x[17];t.peso+=x[13];t.valor+=x[14];t.ent++;
    }
    const pc=mapAdd(R.porCarga,x[0],()=>({custo:0,valor:0}));pc.custo+=x[17];pc.valor+=x[14];
  }
  let sum=0,c=0;for(const[,p]of R.porCarga){if(p.valor>0){sum+=p.custo/p.valor;c++}}
  R.pctVenda=c?sum/c:null;
  return R;
}

function delta(cur,prev,goodUp,fmt,abs){
  if(prev==null||!isFinite(prev)||prev===0&&cur===0)return '<span class="cmp">anterior: —</span>';
  const d=cur-prev,pc=prev?d/Math.abs(prev):null;
  const good=goodUp?d>=0:d<=0;const arr=d>=0?'▲':'▼';
  const cls=Math.abs(d)<1e-9?'eq':good?'up':'dn';
  const txt=abs?(d>=0?'+':'-')+fmt(Math.abs(d)):(pc==null?'':(pc>=0?'+':'')+nf2.format(pc*100)+'%');
  return '<span class="cmp"><span class="'+cls+'">'+arr+' '+txt+'</span> · anterior '+fmt(prev)+'</span>';
}
/* opts: label, cur, prev, fmt, goodUp, tot (valor sem seleção), of=true quando seleção ativa */
function kpi(o){
  const showSel=o.tot!=null&&hasSel;

    +(showSel?'<div class="of">de '+o.fmt(o.tot)+' no total</div>':'')
    +(o.noPrev?(o.sub?'<div class="cmp">'+o.sub+'</div>':''):delta(o.cur,o.prev,o.goodUp!==false,o.fmt,o.abs)+(o.sub?'<div class="cmp">'+o.sub+'</div>':''))
    +'</div>';
}

      });

      if(i%every===0||i===n-1)s+='<text x="'+(ml+i*band+band/2)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(o.labels[i])+'</text>';

function niceStep(mx,t){const r=mx/t,p=Math.pow(10,Math.floor(Math.log10(r))),f=r/p;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}

let CFLIST=null;

function cfItems(){
  const q=S.cliQ.trim().toLowerCase();

function cfLabel(){

  h+='<div class="grid g2">'

const sorted=(arr,k)=>arr.sort((p,q)=>q[k]-p[k]);
const sumRows=(rows,keys)=>{const t={};for(const k of keys)t[k]=rows.reduce((s,r)=>s+(r[k]||0),0);return t};
const colsN=(h,k,f)=>({h,k,f});
const R_=(h,k,f)=>({h,k,r:1,f});
const cm=v=>v==null?'—':fP(v);
const motN=m=>D.motivos[m]||'—';

/* ---- Vendas ---- */
function vendaRows(a,b,pred){
  const V=D.venda,out=[];
  for(let i=0;i<V.d.length;i++){
    const d=V.d[i];if(d<a||d>b||(S.emp&&V.e[i]!==S.emp))continue;
    if(pred(i,V))out.push(i);
  }
  return out;
}
function groupV(idx,keyFn,nameFn,extra){
  const V=D.venda,M=new Map();
  for(const i of idx){
    const k=keyFn(i);let t=M.get(k);if(!t){t={n:nameFn(i),fat:0,custo:0,desc:0,qtd:0,ped:new Set(),itens:0,d:V.d[i],vend:VNAME[V.v[i]]};M.set(k,t)}
    t.fat+=V.fat[i];t.custo+=V.custo[i];t.desc+=V.desc[i];t.qtd+=V.qtd[i];t.ped.add(V.o[i]);t.itens++;
  }
  const rows=[...M.values()];for(const r of rows){r.marp=pctMargem(r.fat,r.custo);r.np=r.ped.size}
  return rows;
}
function totV(rows){const t=sumRows(rows,['fat','custo','desc','qtd','itens']);t.marp=pctMargem(t.fat,t.custo);const s=new Set();for(const r of rows)r.ped.forEach(x=>s.add(x));t.np=s.size;return t}
const cV={cli:colsN('Cliente','n'),prod:colsN('Produto','n'),
  fat:R_('Faturamento','fat',fR),desc:R_('Desconto','desc',fR),qtd:R_('Qtd','qtd',f2),mar:R_('Margem %','marp',cm),np:R_('Pedidos','np',f0)};
const DRILL={
  v_vend(g){
    const[a,b]=range(),idx=vendaRows(a,b,(i,V)=>GV[V.v[i]]===g),V=D.venda;
    const rc=sorted(groupV(idx,i=>V.c[i],i=>CNAME[V.c[i]]||V.c[i]),'fat'),rp=sorted(groupV(idx,i=>PK[V.p[i]],i=>PNAME[PK[V.p[i]]]||PK[V.p[i]]),'fat');
    drillOpen(gname(g),rc.length+' cliente(s) · '+rp.length+' produto(s) · '+periodLabel(a,b),[
      {label:'Clientes',rows:rc,total:totV(rc),cols:[cV.cli,cV.fat,cV.desc,cV.mar,cV.np]},
      {label:'Produtos',rows:rp,total:totV(rp),cols:[cV.prod,cV.fat,cV.qtd,cV.desc,cV.mar]}]);
  },
  v_cli(c){
    const[a,b]=range(),V=D.venda,idx=vendaRows(a,b,(i,V)=>V.c[i]===c);
    const rp=sorted(groupV(idx,i=>PK[V.p[i]],i=>PNAME[PK[V.p[i]]]||PK[V.p[i]]),'fat');
    const ro=groupV(idx,i=>V.o[i],i=>(D.pedref&&D.pedref[V.o[i]]?String(D.pedref[V.o[i]]).split('-').pop():'—')).sort((p,q)=>q.d-p.d);
    drillOpen(CNAME[c]||String(c),ro.length+' pedido(s) · '+rp.length+' produto(s) · '+periodLabel(a,b),[
      {label:'Produtos',rows:rp,total:totV(rp),cols:[cV.prod,cV.fat,cV.qtd,cV.desc,cV.mar]},
      {label:'Pedidos',rows:ro,total:totV(ro),cols:[colsN('Data','d',(v)=>dayStr(v)),colsN('Pedido','n'),colsN('Vendedor','vend'),R_('Itens','itens',f0),cV.fat,cV.desc,cV.mar]}]);
  },
  v_prod(pk){
    const[a,b]=range(),V=D.venda,idx=vendaRows(a,b,(i,V)=>PK[V.p[i]]===pk);
    const rc=sorted(groupV(idx,i=>V.c[i],i=>CNAME[V.c[i]]||V.c[i]),'fat');
    drillOpen(PNAME[pk]||String(pk),rc.length+' cliente(s) · '+periodLabel(a,b),[
      {label:'Clientes',rows:rc,total:totV(rc),cols:[cV.cli,cV.qtd,cV.fat,cV.desc,cV.mar]}]);
  },
  /* ---- Devoluções ---- */
  d_vend(g){const[a,b]=range(),X=D.dev,cf=cliFilter(),V=D.venda;
    const idx=devRows(a,b,(i)=>GV[X.v[i]]===g&&(!cf||cf.has(X.c[i])));
    const fat=new Map();for(const i of vendaRows(a,b,(i,V)=>GV[V.v[i]]===g&&(!cf||cf.has(V.c[i]))))fat.set(V.c[i],(fat.get(V.c[i])||0)+V.fat[i]);
    const M=new Map();for(const i of idx){const c=X.c[i];let t=M.get(c);if(!t){t={n:CNAME[c]||c,valor:0,qtd:0,notas:new Set(),fat:fat.get(c)||0};M.set(c,t)}t.valor+=X.valor[i];t.qtd+=X.qtd[i];t.notas.add(X.n[i])}
    const rc=sorted([...M.values()],'valor');for(const r of rc){r.nn=r.notas.size;r.pct=div(r.valor,r.fat)}
    const tt=sumRows(rc,['valor','qtd','nn','fat']);tt.pct=div(tt.valor,tt.fat);tt.nn=new Set(idx.map(i=>X.n[i])).size;
    drillOpen(gname(g),rc.length+' cliente(s) que devolveram · '+periodLabel(a,b),[
      {label:'Clientes',rows:rc,total:tt,cols:[cV.cli,R_('Devolvido','valor',fR),R_('Qtd','qtd',f2),R_('Notas','nn',f0),R_('Faturamento','fat',fR),R_('% Dev.','pct',cm)]},
      {label:'Produtos e motivo',...devProdMot(idx,'p')}]);
  },
  d_cli(c){const[a,b]=range(),X=D.dev,idx=devRows(a,b,i=>X.c[i]===c);
    drillOpen(CNAME[c]||String(c),'Produtos devolvidos e motivo · '+periodLabel(a,b),[{label:'Produtos e motivo',...devProdMot(idx,'p')}]);
  },
  d_prod(pk){const[a,b]=range(),X=D.dev,cf=cliFilter(),idx=devRows(a,b,i=>PK[X.p[i]]===pk&&(!cf||cf.has(X.c[i])));
    drillOpen(PNAME[pk]||String(pk),'Clientes que devolveram · '+periodLabel(a,b),[{label:'Clientes e motivo',...devProdMot(idx,'c')}]);
  },
  /* ---- Compras ---- */
  c_forn(f){const[a,b]=range(),C=D.compra,idx=compraRows(a,b,i=>C.f[i]===f);
    const rows=sorted(groupC(idx,i=>PK[C.p[i]],i=>PNAME[PK[C.p[i]]]||PK[C.p[i]]),'valor');
    drillOpen(CNAME[f]||String(f),rows.length+' produto(s) · '+periodLabel(a,b),[{label:'Produtos',rows,total:totC(rows),cols:[cV.prod,R_('Qtd','qtd',f2),R_('Valor comprado','valor',fR),R_('Desconto obtido','desc',fR),R_('Custo médio','cm',fR)]}]);
  },
  c_prod(pk){const[a,b]=range(),C=D.compra,idx=compraRows(a,b,i=>PK[C.p[i]]===pk);
    const rows=sorted(groupC(idx,i=>C.f[i],i=>CNAME[C.f[i]]||C.f[i]),'valor');
    drillOpen(PNAME[pk]||String(pk),rows.length+' fornecedor(es) · '+periodLabel(a,b),[{label:'Fornecedores',rows,total:totC(rows),cols:[colsN('Fornecedor','n'),R_('Qtd','qtd',f2),R_('Valor comprado','valor',fR),R_('Desconto obtido','desc',fR),R_('Custo médio','cm',fR),R_('Notas','nn',f0)]}]);
  },
  /* ---- Comissão ---- */
  k_vend(nm){comDrill(nm)}
};
function devRows(a,b,pred){const X=D.dev,out=[];for(let i=0;i<X.d.length;i++){const d=X.d[i];if(d<a||d>b||(S.emp&&X.e[i]!==S.emp))continue;if(pred(i))out.push(i)}return out}
function devProdMot(idx,by){ // by='p' => linhas por produto+motivo ; 'c' => por cliente+motivo
  const X=D.dev,M=new Map();
  for(const i of idx){const k=(by==='p'?PK[X.p[i]]:X.c[i])+'|'+X.m[i];let t=M.get(k);
    if(!t){t={n:by==='p'?(PNAME[PK[X.p[i]]]||PK[X.p[i]]):(CNAME[X.c[i]]||X.c[i]),mot:motN(X.m[i]),valor:0,qtd:0,notas:new Set()};M.set(k,t)}
    t.valor+=X.valor[i];t.qtd+=X.qtd[i];t.notas.add(X.n[i])}
  const rows=sorted([...M.values()],'valor');for(const r of rows)r.nn=r.notas.size;
  const tt=sumRows(rows,['valor','qtd']);tt.nn=new Set(idx.map(i=>X.n[i])).size;
  return{rows,total:tt,cols:[by==='p'?cV.prod:cV.cli,colsN('Motivo','mot'),R_('Qtd','qtd',f2),R_('Notas','nn',f0),R_('Valor','valor',fR)]};
}
function compraRows(a,b,pred){const C=D.compra,out=[];for(let i=0;i<C.d.length;i++){const d=C.d[i];if(d<a||d>b||(S.emp&&C.e[i]!==S.emp))continue;if(pred(i))out.push(i)}return out}
function groupC(idx,keyFn,nameFn){const C=D.compra,M=new Map();
  for(const i of idx){const k=keyFn(i);let t=M.get(k);if(!t){t={n:nameFn(i),valor:0,desc:0,qtd:0,notas:new Set()};M.set(k,t)}t.valor+=C.valor[i];t.desc+=C.desc[i];t.qtd+=C.qtd[i];t.notas.add(C.n[i])}
  const rows=[...M.values()];for(const r of rows){r.cm=div(r.valor,r.qtd);r.nn=r.notas.size}return rows}
function totC(rows){const t=sumRows(rows,['valor','desc','qtd']);t.cm=div(t.valor,t.qtd);return t}

function comDrill(nm){
  const[a,b]=range(),K=D.com,X=D.dev,V=D.venda,pedra=nm.includes('VENDAS NA PEDRA'),pct=(D.comPct||{})[nm]||0;
  const cod=new Set(Object.keys(D.vend).filter(c=>D.vend[c][0]===nm).map(Number));
  const T=aggCom(a,b,false).vend.get(nm)||{tot:0,desc:0,dev:0,base:0,comis:0};
  // por mês
  const mm=new Map();const gm=mi=>mapAdd(mm,mi,()=>({tot:0,desc:0,dev:0}));
  for(let i=0;i<K.d.length;i++){if(K.vend[i]!==nm||K.d[i]<a||K.d[i]>b||(S.emp&&K.e[i]-500!==S.emp))continue;const t=gm(MI[K.d[i]]);t.tot+=K.tot[i];t.desc+=K.desc[i]}
  const devCli=new Map();
  for(let i=0;i<X.d.length;i++){if(!cod.has(X.v[i])||pedra||X.d[i]<a||X.d[i]>b||(S.emp&&X.e[i]!==S.emp))continue;gm(MI[X.d[i]]).dev+=X.valor[i];devCli.set(X.c[i],(devCli.get(X.c[i])||0)+X.valor[i])}
  const rm=[...mm.entries()].sort((p,q)=>p[0]-q[0]).map(([mi,t])=>({n:MLABEL[mi],tot:t.tot,desc:t.desc,dev:t.dev,base:t.tot-t.desc-t.dev,pct,comis:(t.tot-t.desc-t.dev)*pct}));
  const tm={tot:T.tot,desc:T.desc,dev:T.dev,base:T.base,pct,comis:T.comis};
  // por cliente (venda do painel)
  const idx=vendaRows(a,b,(i,V)=>cod.has(V.v[i])),M=new Map();
  for(const i of idx){const c=V.c[i];let t=M.get(c);if(!t){t={n:CNAME[c]||c,tot:0,desc:0,dev:0};M.set(c,t)}t.tot+=V.fat[i]+V.desc[i];t.desc+=V.desc[i]}
  for(const[c,v]of devCli){let t=M.get(c);if(!t){t={n:CNAME[c]||c,tot:0,desc:0,dev:0};M.set(c,t)}t.dev+=v}
  const rc=[...M.values()];for(const r of rc){r.base=r.tot-r.desc-r.dev;r.pct=pct;r.comis=r.base*pct}
  sorted(rc,'comis');
  const sm=sumRows(rc,['tot','desc','dev','base','comis']);
  const adj={n:'Ajuste (itens fora de mercadoria / arredondamento)',tot:T.tot-sm.tot,desc:T.desc-sm.desc,dev:T.dev-sm.dev,base:T.base-sm.base,pct,comis:T.comis-sm.comis};
  if(Math.abs(adj.tot)>0.005||Math.abs(adj.desc)>0.005||Math.abs(adj.dev)>0.005)rc.push(adj);
  const cc=[colsN('Cliente','n'),R_('Venda produto','tot',fR),R_('Descontos','desc',fR),R_('Devolução','dev',fR),R_('Base','base',fR),R_('%','pct',fP),R_('Comissão','comis',fR)];
  drillOpen(nm,'Base × percentual ('+fP(pct)+') · '+periodLabel(a,b),[
    {label:'Base por mês',rows:rm,total:tm,cols:[colsN('Mês','n')].concat(cc.slice(1))},
    {label:'Clientes',rows:rc,total:tm,cols:cc}]);
}

}
/* ===== dados.js criptografado (AES-256-GCM): o painel pede a senha e decifra no navegador, nada sai da máquina ===== */
let PW=null;
async function decifrar(env,senha){
  const u=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0)),te=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',te.encode(senha),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(env.salt),iterations:env.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(env.iv),additionalData:te.encode('takaara-painel-v1')},key,u(env.ct));
  const txt=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  return JSON.parse(txt);
}

function boot(){
  if(!window.DADOS){document.body.innerHTML='<div style="font-family:Arial;max-width:560px;margin:80px auto;padding:24px;border:1px solid #ccc;border-radius:10px"><h2>Não encontrei o arquivo dados.js</h2><p>O <b>Dashboard Takaara.html</b> precisa estar na <b>mesma pasta</b> do <b>dados.js</b> (Painel_ERP). Se você abriu o painel de outra pasta, como Downloads, copie o dados.js junto ou abra o arquivo direto da pasta Painel_ERP.</p></div>';return}
  prepare();
  for(const c in D.vend)NAMECOD[D.vend[c][0]]=+c;
  $('#chkMerge').checked=S.merge;prepare();
  render();
}
$('#btnTema').addEventListener('click',()=>{
  const cur=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  const nx=cur==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',nx);
  try{localStorage.setItem('painel-tema',nx)}catch(e){}render(true);
});
// Recarrega o dados.js; só redesenha se a data de geração mudou (atualização automática)
function recarregarDados(manual){
  const btn=$('#btnAtualizar'),antes=window.DADOS&&window.DADOS.gerado;
  if(manual)btn.textContent='Atualizando…';
  const s=document.createElement('script');s.src='dados.js?t='+Date.now();
  s.onerror=()=>{s.remove();if(manual){btn.textContent='dados.js n\u00e3o encontrado';setTimeout(()=>{btn.textContent='Atualizar dados\u2026'},3000)}};
  s.onload=async()=>{
    try{
      s.remove();
      if(window.DADOS_ENC){
        if(!PW)return;
        if(!manual&&window.DADOS_ENC.gerado===antes)return;
        window.DADOS=await decifrar(window.DADOS_ENC,PW);
      }
      if(manual||window.DADOS.gerado!==antes){CFLIST=null;prepare();for(const c in D.vend)NAMECOD[D.vend[c][0]]=+c;render(true)}
    }catch(e){if(manual)btn.textContent='Falha ao abrir dados.js';return}
    finally{if(manual&&btn.textContent==='Atualizando…')btn.textContent='Atualizar dados…'}
  };
  s.onerror=()=>{if(manual)btn.textContent='Falha ao ler dados.js';s.remove()};
  document.head.appendChild(s);
}
$('#btnAtualizar').addEventListener('click',()=>recarregarDados(true));
setInterval(()=>{if(!document.hidden)recarregarDados(false)},5*60*1000);          // a cada 5 min com a aba aberta
document.addEventListener('visibilitychange',()=>{if(!document.hidden)recarregarDados(false)}); // ao voltar para a aba
addEventListener('resize',(()=>{let t;return()=>{clearTimeout(t);t=setTimeout(()=>render(true),150)}})());
if(!window.DADOS&&window.DADOS_ENC)pedirSenha();else boot();
